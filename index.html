<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
    
    <meta charset="UTF-8">

    <title>Idris's Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #243447;
            background: #f4f7fb;
        }

        header {
            padding: 3rem 1rem;
            text-align: center;
            color: white;
            background: #2563eb;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        nav {
            padding: 1rem;
            text-align: center;
            background: white;
        }

        nav a {
            margin: 0 1rem;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            width: min(900px, 90%);
            margin: 2rem auto;
        }

        section {
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        footer {
            padding: 1rem;
            text-align: center;
            color: white;
            background: #243447;
        }
